<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf7f2;
            margin: 0;
            padding: 0;
        }
        .hero {
            background-image: url('hero-image.jpg');
            background-size: cover;
            background-position: center;
            padding: 80px 0;
            text-align: center;
        }
        .hero h1 {
            color: #6f4e37;
            font-size: 3rem;
            margin: 0;
        }
        .hero p {
            color: #c8a97e;
            font-size: 1.5rem;
        }
        .features {
            padding: 64px 0;
            text-align: center;
        }
        .features h2 {
            color: #6f4e37;
            font-size: 2rem;
            margin-bottom: 24px;
        }
        .features p {
            color: #c8a97e;
            font-size: 1rem;
        }
        .cta {
            background-color: #c8a97e;
            padding: 32px 0;
            text-align: center;
        }
        .cta h2 {
            color: #6f4e37;
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .cta a {
            color: #faf7f2;
            font-size: 1rem;
            text-decoration: none;
            padding: 12px 24px;
            background-color: #6f4e37;
            border-radius: 8px;
        }
        .footer {
            background-color: #6f4e37;
            padding: 32px 0;
            text-align: center;
            color: #faf7f2;
        }
        .footer p {
            margin: 0;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="container mx-auto">
            <h1>Welcome to Our Coffee Shop</h1>
            <p>Enjoy the finest coffee in town.</p>
        </div>
    </section>
    <section class="features">
        <div class="container mx-auto">
            <h2>Why Choose Us?</h2>
            <p>Handcrafted coffee, expertly brewed, in a cozy atmosphere.</p>
        </div>
    </section>
    <section class="cta">
        <div class="container mx-auto">
            <h2>Visit Us Today!</h2>
            <a href="#">Find Out More</a>
        </div>
    </section>
    <footer class="footer">
        <div class="container mx-auto">
            <p>&copy; 2023 Coffee Shop. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
