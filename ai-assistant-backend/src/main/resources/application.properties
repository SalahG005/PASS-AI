spring.application.name=ai-assistant-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/pass_ai_assistant
spring.datasource.username=postgres
spring.datasource.password=0000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=change_this_to_a_long_random_string_at_least_32_characters_long
app.jwt.expiration=604800000
server.port=8081

# Real project files are stored here (per authenticated user)
app.workspace.root=${user.home}/.pass-ai/workspaces

# Ollama (local LLM + embeddings) — install from https://ollama.com then:
#   ollama pull qwen2.5-coder:7b
#   ollama pull nomic-embed-text
#   ollama create pass-ai-coder -f ollama/Modelfile.pass-ai-coder
#   ollama create pass-ai-agent -f ollama/Modelfile.pass-ai-agent
# RTX 3050 6GB: keep 7b (14b will not fit comfortably).
app.ollama.base-url=http://localhost:11434
app.ollama.chat-model=pass-ai-coder
app.ollama.chat-model-fallback=qwen2.5-coder:7b
app.ollama.agent-model=pass-ai-agent
app.ollama.agent-model-fallback=qwen2.5-coder:7b
app.ollama.embed-model=nomic-embed-text
app.ollama.timeout-seconds=600
app.ollama.rag-top-k=5
app.ollama.rag-max-chars=12000
app.ollama.chunk-size=800
app.ollama.chunk-overlap=100
app.ollama.index-max-files=200
app.ollama.index-max-file-bytes=200000
app.ollama.max-tool-steps=6
app.ollama.max-scaffold-tool-steps=24
app.ollama.agent-verify=true
# Post-scaffold HTML layout check (structural; screenshot needs Node+playwright)
app.scaffold.preview.enabled=true
app.scaffold.preview.screenshot=false

# Large folder imports (single ZIP archive)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=4096MB
spring.servlet.multipart.max-request-size=4096MB
spring.servlet.multipart.file-size-threshold=2KB
server.tomcat.max-http-form-post-size=4096MB
server.tomcat.max-swallow-size=4096MB
server.tomcat.connection-timeout=3600000
spring.mvc.async.request-timeout=3600000
